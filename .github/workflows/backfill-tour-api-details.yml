name: Backfill Tour API Details

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/backfill-tour-api-details.yml"
      - "scripts/backfill-tour-api-details.mjs"
      - "scripts/polish-contextual-copy.mjs"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of existing posts to refresh"
        required: false
        default: "120"
      offset:
        description: "Number of eligible posts to skip before this batch"
        required: false
        default: "0"
      image_mode:
        description: "Image backfill mode: sample, full, or off"
        required: false
        default: "sample"
      image_sample_size:
        description: "Number of posts for detailImage2 sample test"
        required: false
        default: "20"
      retry_image_incomplete:
        description: "Retry posts that already attempted image backfill but still have fewer than 3 images"
        required: false
        default: "false"
      targets:
        description: "Comma-separated post slugs to refresh before offset/limit batching"
        required: false
        default: ""
      photo_gallery_mode:
        description: "PhotoGalleryService1 mode: sample or off"
        required: false
        default: "off"
      photo_gallery_sample_size:
        description: "Number of posts for PhotoGalleryService1 sample test"
        required: false
        default: "30"
      durunubi_mode:
        description: "Durunubi walking course sample mode: sample or off"
        required: false
        default: "off"
      durunubi_sample_size:
        description: "Number of trail-like posts for Durunubi sample test"
        required: false
        default: "25"

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Install Pillow for image processing
        run: pip install --quiet Pillow

      - name: Validate backfill scripts
        run: |
          node --check scripts/backfill-tour-api-details.mjs
          node --check scripts/polish-contextual-copy.mjs
          node --check scripts/report-photo-coverage.mjs
          node --check scripts/sample-durunubi.mjs

      - name: Sample TourAPI gallery images
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_mode == 'sample' }}
        run: |
          IMAGE_SAMPLE_SIZE="${{ github.event.inputs.image_sample_size || '20' }}"
          BACKFILL_IMAGE_SAMPLE=1 BACKFILL_IMAGE_SAMPLE_SIZE="$IMAGE_SAMPLE_SIZE" BACKFILL_IMAGE_SAMPLE_CONCURRENCY=5 node scripts/backfill-tour-api-details.mjs
        env:
          TRIPVIEW_API_KEY: ${{ secrets.TRIPVIEW_API_KEY }}
          TRIPVIEW_API_KEY_PARAM: ${{ secrets.TRIPVIEW_API_KEY_PARAM }}

      - name: Sample PhotoGalleryService1 images
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.photo_gallery_mode == 'sample' }}
        run: |
          if [ -z "$PHOTO_GALLERY_API_KEY" ]; then
            echo "::error::PHOTO_GALLERY_API_KEY is required for PhotoGalleryService1 sample. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          PHOTO_GALLERY_SAMPLE_SIZE="${{ github.event.inputs.photo_gallery_sample_size || '30' }}"
          BACKFILL_PHOTO_GALLERY_SAMPLE=1 PHOTO_GALLERY_SAMPLE_SIZE="$PHOTO_GALLERY_SAMPLE_SIZE" PHOTO_GALLERY_SAMPLE_CONCURRENCY=4 node scripts/backfill-tour-api-details.mjs --photo-gallery-sample
        env:
          PHOTO_GALLERY_API_KEY: ${{ secrets.PHOTO_GALLERY_API_KEY }}

      - name: Sample Durunubi walking courses
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.durunubi_mode == 'sample' }}
        continue-on-error: true
        run: |
          if [ -z "$DURUNUBI_API_KEY" ]; then
            echo "::error::DURUNUBI_API_KEY is required for Durunubi sample. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          DURUNUBI_SAMPLE_SIZE="${{ github.event.inputs.durunubi_sample_size || '25' }}"
          DURUNUBI_SAMPLE_SIZE="$DURUNUBI_SAMPLE_SIZE" node scripts/sample-durunubi.mjs
        env:
          DURUNUBI_API_KEY: ${{ secrets.DURUNUBI_API_KEY }}

      - name: Backfill Tour API details
        if: ${{ github.event.inputs.image_mode == 'full' || github.event.inputs.image_mode == 'off' }}
        run: |
          IMAGE_MODE="${{ github.event.inputs.image_mode }}"
          BACKFILL_BATCH_LIMIT="${{ github.event.inputs.limit || '120' }}"
          BACKFILL_BATCH_OFFSET="${{ github.event.inputs.offset || '0' }}"
          BACKFILL_RETRY_INCOMPLETE="${{ github.event.inputs.retry_image_incomplete || 'false' }}"
          BACKFILL_TARGETS_INPUT="${{ github.event.inputs.targets || '' }}"
          if [ "$IMAGE_MODE" = "full" ]; then
            if [ "$BACKFILL_RETRY_INCOMPLETE" = "true" ]; then
              BACKFILL_TARGETS="$BACKFILL_TARGETS_INPUT" BACKFILL_RETRY_IMAGE_INCOMPLETE=1 BACKFILL_INCLUDE_IMAGES=1 BACKFILL_INCLUDE_PHOTO_GALLERY=1 BACKFILL_LIMIT="$BACKFILL_BATCH_LIMIT" BACKFILL_OFFSET="$BACKFILL_BATCH_OFFSET" node scripts/backfill-tour-api-details.mjs
            else
              BACKFILL_TARGETS="$BACKFILL_TARGETS_INPUT" BACKFILL_INCLUDE_IMAGES=1 BACKFILL_INCLUDE_PHOTO_GALLERY=1 BACKFILL_LIMIT="$BACKFILL_BATCH_LIMIT" BACKFILL_OFFSET="$BACKFILL_BATCH_OFFSET" node scripts/backfill-tour-api-details.mjs
            fi
          elif [ "$IMAGE_MODE" = "off" ]; then
            BACKFILL_TARGETS="$BACKFILL_TARGETS_INPUT" BACKFILL_LIMIT="$BACKFILL_BATCH_LIMIT" BACKFILL_OFFSET="$BACKFILL_BATCH_OFFSET" node scripts/backfill-tour-api-details.mjs
          fi
          node scripts/polish-contextual-copy.mjs
          npm run build
        env:
          TRIPVIEW_API_KEY: ${{ secrets.TRIPVIEW_API_KEY }}
          TRIPVIEW_API_KEY_PARAM: ${{ secrets.TRIPVIEW_API_KEY_PARAM }}
          PHOTO_GALLERY_API_KEY: ${{ secrets.PHOTO_GALLERY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY || secrets.PARTNER_API_KEY || secrets.MYREALTRIP_PARTNER_API_KEY }}
          PARTNER_API_KEY: ${{ secrets.PARTNER_API_KEY }}
          MYREALTRIP_ACCOMMODATION_REGION_URL: ${{ vars.MYREALTRIP_ACCOMMODATION_REGION_URL || secrets.MYREALTRIP_ACCOMMODATION_REGION_URL }}
          MYREALTRIP_ACCOMMODATION_SEARCH_URL: ${{ vars.MYREALTRIP_ACCOMMODATION_SEARCH_URL || secrets.MYREALTRIP_ACCOMMODATION_SEARCH_URL }}
          MYREALTRIP_ACCOMMODATION_KEYWORDS: ${{ vars.MYREALTRIP_ACCOMMODATION_KEYWORDS }}
          MYREALTRIP_ACCOMMODATION_KEYWORD: ${{ vars.MYREALTRIP_ACCOMMODATION_KEYWORD }}
          MYREALTRIP_ACCOMMODATION_IS_DOMESTIC: ${{ vars.MYREALTRIP_ACCOMMODATION_IS_DOMESTIC || 'true' }}
          MYREALTRIP_ACCOMMODATION_SIZE: ${{ vars.MYREALTRIP_ACCOMMODATION_SIZE || '30' }}
          MYREALTRIP_ACCOMMODATION_REGION_LIMIT: ${{ vars.MYREALTRIP_ACCOMMODATION_REGION_LIMIT || '100' }}
          MYREALTRIP_ACCOMMODATION_PER_REGION_LIMIT: ${{ vars.MYREALTRIP_ACCOMMODATION_PER_REGION_LIMIT || '8' }}
          MYREALTRIP_ACCOMMODATION_LIMIT: ${{ vars.MYREALTRIP_ACCOMMODATION_LIMIT || '240' }}

      - name: Report article photo coverage
        if: ${{ github.event.inputs.image_mode == 'full' || github.event.inputs.image_mode == 'off' }}
        run: node scripts/report-photo-coverage.mjs

      - name: Verify enriched article data
        if: ${{ github.event.inputs.image_mode == 'full' || github.event.inputs.image_mode == 'off' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const posts = JSON.parse(fs.readFileSync('data/generated-posts.json', 'utf8'));
          const enriched = posts.filter((post) => post.tourApi?.overview || Object.keys(post.tourApi?.intro || {}).length);
          if (enriched.length < Math.min(posts.length, 20)) {
            throw new Error(`Too few enriched posts: ${enriched.length}/${posts.length}`);
          }
          const html = fs.readFileSync(`dist/${enriched[0].slug}/index.html`, 'utf8');
          if (!html.includes('data-tripview-article') && !html.includes('article-place-intro')) {
            throw new Error('API-derived article sections were not rendered.');
          }
          console.log(`Verified TourAPI detail enrichment: ${enriched.length}/${posts.length}`);
          NODE

      - name: Commit backfilled posts
        if: ${{ github.event.inputs.image_mode == 'full' || github.event.inputs.image_mode == 'off' }}
        run: |
          if git diff --quiet; then
            echo "No TourAPI detail changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Backfill Tour API details"
          git push
