name: Check MyRealTrip API Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check MyRealTrip API secret
        run: node scripts/check-myrealtrip-secret.mjs
        env:
          MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY }}
          MYREALTRIP_API_BASE_URL: ${{ vars.MYREALTRIP_API_BASE_URL }}
