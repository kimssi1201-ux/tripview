name: Build Homepage

on:
  push:
    paths:
      - '.github/workflows/build-homepage.yml'
      - 'data/homepage-content.json'
      - 'scripts/add-adsense.mjs'
      - 'scripts/add-helpful-article-sections.mjs'
      - 'scripts/add-image-zoom.mjs'
      - 'scripts/add-i18n.mjs'
      - 'scripts/add-map-preview.mjs'
      - 'scripts/apply-homepage-content-config.mjs'
      - 'scripts/build-homepage.mjs'
      - 'scripts/enrich-tour-posts.mjs'
      - 'scripts/fix-reference-homepage-categories.mjs'
      - 'scripts/format-program-sections.mjs'
      - 'scripts/merge-manual-posts.mjs'
      - 'scripts/polish-adsense-readiness.mjs'
      - 'scripts/restructure-homepage-reference.mjs'
      - 'assets/i18n.js'
      - 'data/manual-posts-*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merge manual posts
        run: node scripts/merge-manual-posts.mjs

      - name: Enrich generated posts
        run: node scripts/enrich-tour-posts.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          OPENAI_ENRICH_LIMIT: "0"
          OPENAI_TIMEOUT_MS: ${{ vars.OPENAI_TIMEOUT_MS || '90000' }}

      - name: Format program sections
        run: node scripts/format-program-sections.mjs

      - name: Add helpful article sections
        run: node scripts/add-helpful-article-sections.mjs

      - name: Build homepage
        run: node scripts/build-homepage.mjs

      - name: Apply reference homepage structure
        run: node scripts/restructure-homepage-reference.mjs

      - name: Fix reference homepage categories
        run: node scripts/fix-reference-homepage-categories.mjs

      - name: Build RSS feed
        run: node scripts/build-feed.mjs

      - name: Polish AdSense readiness
        run: node scripts/polish-adsense-readiness.mjs

      - name: Apply homepage content config
        run: node scripts/apply-homepage-content-config.mjs

      - name: Apply homepage image zoom
        run: node scripts/add-image-zoom.mjs

      - name: Apply head tags
        run: node scripts/add-adsense.mjs

      - name: Apply internationalization
        run: node scripts/add-i18n.mjs

      - name: Apply map previews
        run: node scripts/add-map-preview.mjs

      - name: Commit homepage updates
        run: |
          if git diff --quiet; then
            echo "No homepage changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Refresh posts and homepage"
          git pull --rebase origin main
          git push
