name: Tripview auto update

on:
  schedule:
    - cron: "15 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Merge external posts
        run: npm run refresh
        env:
          TRIPVIEW_POSTS_SOURCE_URL: ${{ secrets.TRIPVIEW_POSTS_SOURCE_URL }}
          TRIPVIEW_API_KEY: ${{ secrets.TRIPVIEW_API_KEY }}
          TRIPVIEW_API_KEY_PARAM: ${{ secrets.TRIPVIEW_API_KEY_PARAM }}
          TRIPVIEW_API_KEY_HEADER: ${{ secrets.TRIPVIEW_API_KEY_HEADER }}

      - name: Build static files
        run: npm run build

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json feed.xml sitemap.xml www site
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update travel posts"
            git push
          fi
