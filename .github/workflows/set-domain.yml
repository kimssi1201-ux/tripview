name: Set Production Domain

on:
  push:
    paths:
      - '.github/workflows/set-domain.yml'
      - 'scripts/set-domain.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Replace production domain
        run: node scripts/set-domain.mjs

      - name: Build Astro static files
        run: npm run build

      - name: Commit domain update
        run: |
          if git diff --quiet; then
            echo "No domain changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Switch site URL to tripview.kr"
          git push
