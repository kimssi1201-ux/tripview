name: Manual Tour Drafts

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of pending drafts to generate"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: daily-tour-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install image processing dependencies
        run: python3 -m pip install --user pillow

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Generate pending tour drafts
        run: node scripts/daily-tour-posts.mjs
        env:
          TRIPVIEW_API_KEY: ${{ secrets.TRIPVIEW_API_KEY }}
          POST_LIMIT: ${{ github.event.inputs.limit || '5' }}
          MAX_IMAGES_PER_POST: "3"

      - name: Enrich generated posts
        run: node scripts/enrich-tour-posts.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          OPENAI_ENRICH_LIMIT: ${{ vars.OPENAI_ENRICH_LIMIT || '10' }}
          OPENAI_TIMEOUT_MS: ${{ vars.OPENAI_TIMEOUT_MS || '90000' }}

      - name: Format program sections
        run: node scripts/format-program-sections.mjs

      - name: Polish contextual article copy
        run: node scripts/polish-contextual-copy.mjs

      - name: Fetch MyRealTrip accommodations
        run: node scripts/fetch-myrealtrip-accommodations.mjs
        env:
          MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY || secrets.PARTNER_API_KEY || secrets.MYREALTRIP_PARTNER_API_KEY }}
          PARTNER_API_KEY: ${{ secrets.PARTNER_API_KEY }}
          MYREALTRIP_ACCOMMODATION_REGION_URL: ${{ vars.MYREALTRIP_ACCOMMODATION_REGION_URL || secrets.MYREALTRIP_ACCOMMODATION_REGION_URL }}
          MYREALTRIP_ACCOMMODATION_SEARCH_URL: ${{ vars.MYREALTRIP_ACCOMMODATION_SEARCH_URL || secrets.MYREALTRIP_ACCOMMODATION_SEARCH_URL }}
          MYREALTRIP_ACCOMMODATION_KEYWORDS: ${{ vars.MYREALTRIP_ACCOMMODATION_KEYWORDS }}
          MYREALTRIP_ACCOMMODATION_KEYWORD: ${{ vars.MYREALTRIP_ACCOMMODATION_KEYWORD }}
          MYREALTRIP_ACCOMMODATION_IS_DOMESTIC: ${{ vars.MYREALTRIP_ACCOMMODATION_IS_DOMESTIC || 'true' }}
          MYREALTRIP_ACCOMMODATION_NIGHTS: ${{ vars.MYREALTRIP_ACCOMMODATION_NIGHTS || '2' }}
          MYREALTRIP_ACCOMMODATION_ADULT_COUNT: ${{ vars.MYREALTRIP_ACCOMMODATION_ADULT_COUNT || '2' }}
          MYREALTRIP_ACCOMMODATION_CHILD_COUNT: ${{ vars.MYREALTRIP_ACCOMMODATION_CHILD_COUNT || '0' }}
          MYREALTRIP_ACCOMMODATION_STAR_RATING: ${{ vars.MYREALTRIP_ACCOMMODATION_STAR_RATING }}
          MYREALTRIP_ACCOMMODATION_REGION_LIMIT: ${{ vars.MYREALTRIP_ACCOMMODATION_REGION_LIMIT || '100' }}
          MYREALTRIP_ACCOMMODATION_PER_REGION_LIMIT: ${{ vars.MYREALTRIP_ACCOMMODATION_PER_REGION_LIMIT || '8' }}
          MYREALTRIP_ACCOMMODATION_LIMIT: ${{ vars.MYREALTRIP_ACCOMMODATION_LIMIT || '240' }}

      - name: Fetch MyRealTrip TNA products
        run: node scripts/fetch-myrealtrip-tna-products.mjs
        env:
          MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY || secrets.PARTNER_API_KEY || secrets.MYREALTRIP_PARTNER_API_KEY }}
          PARTNER_API_KEY: ${{ secrets.PARTNER_API_KEY }}
          MYREALTRIP_TNA_SEARCH_URL: ${{ vars.MYREALTRIP_TNA_SEARCH_URL || secrets.MYREALTRIP_TNA_SEARCH_URL }}
          MYREALTRIP_TNA_KEYWORDS: ${{ vars.MYREALTRIP_TNA_KEYWORDS }}
          MYREALTRIP_TNA_KEYWORD: ${{ vars.MYREALTRIP_TNA_KEYWORD }}
          MYREALTRIP_TNA_CATEGORY: ${{ vars.MYREALTRIP_TNA_CATEGORY }}
          MYREALTRIP_TNA_MIN_PRICE: ${{ vars.MYREALTRIP_TNA_MIN_PRICE }}
          MYREALTRIP_TNA_MAX_PRICE: ${{ vars.MYREALTRIP_TNA_MAX_PRICE }}
          MYREALTRIP_TNA_SORT: ${{ vars.MYREALTRIP_TNA_SORT || 'price_asc' }}
          MYREALTRIP_TNA_SIZE: ${{ vars.MYREALTRIP_TNA_SIZE || '30' }}
          MYREALTRIP_TNA_QUERY_LIMIT: ${{ vars.MYREALTRIP_TNA_QUERY_LIMIT || '70' }}
          MYREALTRIP_TNA_PER_QUERY_LIMIT: ${{ vars.MYREALTRIP_TNA_PER_QUERY_LIMIT || '6' }}
          MYREALTRIP_TNA_LIMIT: ${{ vars.MYREALTRIP_TNA_LIMIT || '200' }}

      - name: Fetch MyRealTrip flight deals
        run: node scripts/fetch-myrealtrip-flight-deals.mjs
        env:
          MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY || secrets.PARTNER_API_KEY || secrets.MYREALTRIP_PARTNER_API_KEY }}
          PARTNER_API_KEY: ${{ secrets.PARTNER_API_KEY }}
          MYREALTRIP_FLIGHT_API_URL: ${{ vars.MYREALTRIP_FLIGHT_API_URL || secrets.MYREALTRIP_FLIGHT_API_URL }}
          MYREALTRIP_FLIGHT_LOWEST_URL: ${{ vars.MYREALTRIP_FLIGHT_LOWEST_URL || secrets.MYREALTRIP_FLIGHT_LOWEST_URL }}
          PARTNER_FLIGHT_API_URL: ${{ vars.PARTNER_FLIGHT_API_URL || secrets.PARTNER_FLIGHT_API_URL }}
          MYREALTRIP_FLIGHT_DEP_AIRPORT: ${{ vars.MYREALTRIP_FLIGHT_DEP_AIRPORT || 'ICN' }}
          MYREALTRIP_FLIGHT_PERIOD: ${{ vars.MYREALTRIP_FLIGHT_PERIOD || '5' }}
          MYREALTRIP_FLIGHT_LIMIT: ${{ vars.MYREALTRIP_FLIGHT_LIMIT || '8' }}
          MYREALTRIP_FLIGHT_URL_TEMPLATE: ${{ vars.MYREALTRIP_FLIGHT_URL_TEMPLATE || secrets.MYREALTRIP_FLIGHT_URL_TEMPLATE }}
          MYREALTRIP_FLIGHT_BOOKING_URL: ${{ vars.MYREALTRIP_FLIGHT_BOOKING_URL || 'https://flights.myrealtrip.com/' }}

      - name: Fetch Coupang products
        run: node scripts/fetch-coupang-products.mjs
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY || secrets.COUPANG_PARTNERS_ACCESS_KEY || secrets.COUPANG_PARTNER_ACCESS_KEY || vars.COUPANG_ACCESS_KEY || vars.COUPANG_PARTNERS_ACCESS_KEY || vars.COUPANG_PARTNER_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY || secrets.COUPANG_PARTNERS_SECRET_KEY || secrets.COUPANG_PARTNER_SECRET_KEY || vars.COUPANG_SECRET_KEY || vars.COUPANG_PARTNERS_SECRET_KEY || vars.COUPANG_PARTNER_SECRET_KEY }}
          COUPANG_PARTNER_ID: ${{ secrets.COUPANG_PARTNER_ID || secrets.COUPANG_PARTNERS_ID || vars.COUPANG_PARTNER_ID || vars.COUPANG_PARTNERS_ID }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID || secrets.COUPANG_CHANNEL_ID || vars.COUPANG_SUB_ID || vars.COUPANG_CHANNEL_ID }}

      - name: Build homepage
        run: node scripts/build-homepage.mjs

      - name: Apply homepage layout
        run: |
          node scripts/apply-homepage-content-config.mjs
          node scripts/add-image-zoom.mjs
          node scripts/add-adsense.mjs
          node scripts/add-i18n.mjs
          node scripts/add-map-preview.mjs

      - name: Build RSS feed
        run: node scripts/build-feed.mjs

      - name: Build static export
        run: npm run build

      - name: Commit pending drafts
        run: |
          if git diff --quiet; then
            echo "No new posts to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add pending tour drafts"
          git pull --rebase origin main
          git push
