name: Daily Tour Posts

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/daily-tour-posts.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of posts to generate"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  post:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate daily tour posts
        run: node scripts/daily-tour-posts.mjs
        env:
          TRIPVIEW_API_KEY: ${{ secrets.TRIPVIEW_API_KEY }}
          POST_LIMIT: ${{ github.event.inputs.limit || '10' }}

      - name: Commit generated posts
        run: |
          if git diff --quiet; then
            echo "No new posts to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add daily tour posts"
          git push
