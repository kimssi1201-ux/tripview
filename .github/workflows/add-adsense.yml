name: Add AdSense Script

on:
  push:
    paths:
      - '.github/workflows/add-adsense.yml'
      - 'scripts/add-adsense.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Insert AdSense script
        run: node scripts/add-adsense.mjs

      - name: Commit AdSense updates
        run: |
          if git diff --quiet; then
            echo "No AdSense changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add AdSense verification script"
          git push
