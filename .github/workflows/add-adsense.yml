name: Add AdSense Script

on:
  push:
    paths:
      - '.github/workflows/add-adsense.yml'
      - 'scripts/add-adsense.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build Astro static files
        run: npm run build

      - name: Verify AdSense script
        run: |
          grep -q "pagead2.googlesyndication.com/pagead/js/adsbygoogle.js" dist/index.html
          grep -q "ca-pub-5751319666030430" dist/index.html
