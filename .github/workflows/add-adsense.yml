name: Add AdSense Script

on:
  push:
    paths:
      - '.github/workflows/add-adsense.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Insert AdSense into generators
        run: |
          python3 <<'PY'
          from pathlib import Path
          
          PUBLISHER = 'ca-pub-6066428844912614'
          ADSENSE = """<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6066428844912614"
             crossorigin="anonymous"></script>"""
          
          for script in [Path('scripts/daily-tour-posts.mjs'), Path('scripts/enrich-tour-posts.mjs')]:
              source = script.read_text(encoding='utf-8')
              if PUBLISHER not in source:
                  source = source.replace('<head>\n    <meta', f'<head>\n    {ADSENSE}\n    <meta')
                  script.write_text(source, encoding='utf-8')
          PY

      - name: Regenerate and verify pages
        run: |
          node --check scripts/daily-tour-posts.mjs
          node --check scripts/enrich-tour-posts.mjs
          node scripts/enrich-tour-posts.mjs
          python3 <<'PY'
          from pathlib import Path
          
          PUBLISHER = 'ca-pub-6066428844912614'
          ADSENSE = """<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6066428844912614"
               crossorigin="anonymous"></script>"""
          
          changed = 0
          missing = []
          html_files = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              html_files.append(path)
              text = path.read_text(encoding='utf-8')
              if '<head>' in text and PUBLISHER not in text:
                  text = text.replace('<head>', f'<head>\n    {ADSENSE}', 1)
                  path.write_text(text, encoding='utf-8')
                  changed += 1
          
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              if '<head>' in text and PUBLISHER not in text:
                  missing.append(str(path))
          
