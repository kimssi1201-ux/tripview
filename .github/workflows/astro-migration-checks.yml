name: Astro Migration Checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "astro-migration"]
    paths:
      - "src/**"
      - "assets/*.js"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "astro.config.mjs"
      - ".github/workflows/astro-migration-checks.yml"

permissions:
  contents: read

concurrency:
  group: astro-migration-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Install image processing dependencies
        run: python3 -m pip install --user pillow

      - name: Run syntax check
        run: npm run lint

      - name: Audit content
        run: npm run audit:content

      - name: Report articles needing manual verification
        run: npm run audit:adsense

      - name: Build and validate Astro output
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Retain content and image quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripview-code-audit
          path: |
            reports/adsense-readiness.json
            reports/content-quality-report.json
            reports/content-quality-report.md
            reports/post-image-audit.json
          if-no-files-found: ignore
