name: Build RSS Feed

on:
  push:
    paths:
      - '.github/workflows/build-feed.yml'
      - 'scripts/build-feed.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build Astro RSS files
        run: npm run build

      - name: Verify RSS files
        run: |
          test -s dist/rss.xml
          test -s dist/feed.xml
