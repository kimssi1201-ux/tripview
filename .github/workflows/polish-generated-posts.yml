name: Validate Public Wording

on:
  push:
    paths:
      - ".github/workflows/polish-generated-posts.yml"
      - "src/**"
      - "data/generated-posts.json"
      - "data/manual-*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wording:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Install image processing dependencies
        run: python3 -m pip install --user pillow

      - name: Build Astro static files
        run: npm run build

      - name: Verify rendered wording
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const banned = [
            '공연/축제 글감입니다',
            '국내여행 글감입니다',
            '글감을 큐레이션합니다',
            '처음 보는 사람에게',
            '사진만 보고 움직이기보다',
          ];

          function* htmlFiles(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) yield* htmlFiles(fullPath);
              else if (entry.isFile() && entry.name.endsWith('.html')) yield fullPath;
            }
          }

          const failures = [];
          for (const file of htmlFiles('dist')) {
            const html = fs.readFileSync(file, 'utf8');
            for (const term of banned) {
              if (html.includes(term)) failures.push(`${file}: ${term}`);
            }
          }

          if (failures.length) {
            throw new Error(`Public wording check failed:\n${failures.slice(0, 20).join('\n')}`);
          }

          console.log('Rendered public wording check passed.');
          NODE
