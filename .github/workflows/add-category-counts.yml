name: Validate Category Hubs

on:
  push:
    paths:
      - ".github/workflows/add-category-counts.yml"
      - "src/pages/travel/index.astro"
      - "src/pages/festival/index.astro"
      - "src/pages/stay/index.astro"
      - "src/pages/ticket/index.astro"
      - "src/components/PostSection.astro"
      - "src/components/TravelCard.astro"
      - "src/lib/content.mjs"
      - "data/generated-posts.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  category-hubs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Install image processing dependencies
        run: python3 -m pip install --user pillow

      - name: Build Astro static files
        run: npm run build

      - name: Verify category hub output
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const pages = [
            { path: 'dist/travel/index.html', canonical: 'https://tripview.kr/travel/', required: ['9월 해외여행', '가을·단풍', '여행지 글 목록'] },
            { path: 'dist/festival/index.html', canonical: 'https://tripview.kr/festival/', required: ['진행 중인 축제', '예정 축제', '축제·행사 글 목록'] },
            { path: 'dist/stay/index.html', canonical: 'https://tripview.kr/stay/', required: ['인기 숙소'] },
            { path: 'dist/ticket/index.html', canonical: 'https://tripview.kr/ticket/', required: ['입장권'] },
          ];

          for (const page of pages) {
            const html = fs.readFileSync(page.path, 'utf8');
            if (!html.includes(`<link rel="canonical" href="${page.canonical}"`)) {
              throw new Error(`${page.path} canonical is missing or incorrect.`);
            }
            for (const text of page.required) {
              if (!html.includes(text)) throw new Error(`${page.path} is missing "${text}".`);
            }
            if (!/<a[^>]+href="\/(?:travel|festival|data)-[^"]+\//.test(html)) {
              throw new Error(`${page.path} does not link to rendered posts.`);
            }
          }

          console.log(`Verified ${pages.length} Astro category hub page(s).`);
          NODE
