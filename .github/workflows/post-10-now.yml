name: Post 10 Tour Posts Now

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Limit images to 3 per new post
        run: |
          python3 <<'PY'
          from pathlib import Path
          
          script = Path('scripts/daily-tour-posts.mjs')
          source = script.read_text(encoding='utf-8')
          
          if 'MAX_IMAGES_PER_POST' not in source:
              source = source.replace(
                  "const POST_LIMIT = Math.max(1, Number.parseInt(process.env.POST_LIMIT || '10', 10) || 10);",
                  "const POST_LIMIT = Math.max(1, Number.parseInt(process.env.POST_LIMIT || '10', 10) || 10);\nconst MAX_IMAGES_PER_POST = Math.max(1, Math.min(3, Number.parseInt(process.env.MAX_IMAGES_PER_POST || '3', 10) || 3));",
                  1,
              )
          
          source = source.replace(
              "function addImage(images, seen, src) {\n  if (!src) return;",
              "function addImage(images, seen, src) {\n  if (!src || images.length >= MAX_IMAGES_PER_POST) return;",
              1,
          )
          source = source.replace(
              "  for (const image of detailImages) addImage(images, seen, image.originimgurl || image.smallimageurl);\n  for (const src of seedImages) addImage(images, seen, src);\n  return images;",
              "  for (const image of detailImages) {\n    addImage(images, seen, image.originimgurl || image.smallimageurl);\n    if (images.length >= MAX_IMAGES_PER_POST) break;\n  }\n  for (const src of seedImages) {\n    addImage(images, seen, src);\n    if (images.length >= MAX_IMAGES_PER_POST) break;\n  }\n  return images.slice(0, MAX_IMAGES_PER_POST);",
              1,
          )
          
          script.write_text(source, encoding='utf-8')
          PY

      - name: Generate 10 posts
        env:
          TRIPVIEW_API_KEY: ${{ secrets.TRIPVIEW_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          OPENAI_ENRICH_LIMIT: ${{ vars.OPENAI_ENRICH_LIMIT || '10' }}
          OPENAI_TIMEOUT_MS: ${{ vars.OPENAI_TIMEOUT_MS || '90000' }}
        run: |
          node --check scripts/daily-tour-posts.mjs
          node --check scripts/enrich-tour-posts.mjs
          POST_LIMIT=10 MAX_IMAGES_PER_POST=3 node scripts/daily-tour-posts.mjs
          node scripts/enrich-tour-posts.mjs

      - name: Apply homepage layout
        run: |
          node scripts/apply-homepage-content-config.mjs
          node scripts/add-image-zoom.mjs
          node scripts/add-adsense.mjs
          node scripts/add-i18n.mjs
          node scripts/add-map-preview.mjs
          node scripts/build-feed.mjs

      - name: Verify posts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:data/generated-posts.json'], { encoding: 'utf8' }));
          const after = JSON.parse(fs.readFileSync('data/generated-posts.json', 'utf8'));
          const added = after.length - before.length;
          if (added < 10) throw new Error(`Expected 10 new posts, got ${added}`);
          const newPosts = after.slice(0, added);
          const tooManyImages = newPosts.filter((post) => (post.images || []).length > 3);
          if (tooManyImages.length) throw new Error(`Posts over image limit: ${tooManyImages.map((post) => post.slug).join(', ')}`);
          const duplicateSlugs = newPosts.filter((post, index) => newPosts.findIndex((item) => item.slug === post.slug) !== index);
          if (duplicateSlugs.length) throw new Error(`Duplicate new slugs: ${duplicateSlugs.map((post) => post.slug).join(', ')}`);
          const homepage = fs.readFileSync('index.html', 'utf8');
          if (!homepage.includes('id="region-guide"') || !homepage.includes('directory-section')) throw new Error('Homepage layout missing from index');
          console.log(`Verified ${added} new posts. Max new post images: ${Math.max(...newPosts.map((post) => (post.images || []).length))}`);
          for (const post of newPosts.slice(0, 10)) console.log(`- ${post.slug}: ${(post.images || []).length} image(s)`);
          NODE

      - name: Commit generated posts
        run: |
          if git diff --quiet; then
            echo "No new posts to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add 10 tour posts"
          git push
