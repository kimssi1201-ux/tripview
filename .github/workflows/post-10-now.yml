name: Post 10 Tour Posts Now

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Limit images to 3 per new post
        run: |
          python3 <<'PY'
          from pathlib import Path
          
          script = Path('scripts/daily-tour-posts.mjs')
          source = script.read_text(encoding='utf-8')
          
          if 'MAX_IMAGES_PER_POST' not in source:
              source = source.replace(
                  "const POST_LIMIT = Math.max(1, Number.parseInt(process.env.POST_LIMIT || '10', 10) || 10);",
                  "const POST_LIMIT = Math.max(1, Number.parseInt(process.env.POST_LIMIT || '10', 10) || 10);\nconst MAX_IMAGES_PER_POST = Math.max(1, Math.min(3, Number.parseInt(process.env.MAX_IMAGES_PER_POST || '3', 10) || 3));",
                  1,
              )
          
          source = source.replace(
              "function addImage(images, seen, src) {\n  if (!src) return;",
              "function addImage(images, seen, src) {\n  if (!src || images.length >= MAX_IMAGES_PER_POST) return;",
              1,
          )
          source = source.replace(
              "  for (const image of detailImages) addImage(images, seen, image.originimgurl || image.smallimageurl);\n  for (const src of seedImages) addImage(images, seen, src);\n  return images;",
              "  for (const image of detailImages) {\n    addImage(images, seen, image.originimgurl || image.smallimageurl);\n    if (images.length >= MAX_IMAGES_PER_POST) break;\n  }\n  for (const src of seedImages) {\n    addImage(images, seen, src);\n    if (images.length >= MAX_IMAGES_PER_POST) break;\n  }\n  return images.slice(0, MAX_IMAGES_PER_POST);",
              1,
          )
          
          script.write_text(source, encoding='utf-8')
          PY

      - name: Generate 10 posts
        env:
          TRIPVIEW_API_KEY: ${{ secrets.TRIPVIEW_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          OPENAI_ENRICH_LIMIT: ${{ vars.OPENAI_ENRICH_LIMIT || '10' }}
          OPENAI_TIMEOUT_MS: ${{ vars.OPENAI_TIMEOUT_MS || '90000' }}
        run: |
          node --check scripts/daily-tour-posts.mjs
          node --check scripts/enrich-tour-posts.mjs
          POST_LIMIT=10 MAX_IMAGES_PER_POST=3 node scripts/daily-tour-posts.mjs
          node scripts/enrich-tour-posts.mjs
          node scripts/polish-contextual-copy.mjs

      - name: Apply homepage layout
        env:
          MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY || secrets.PARTNER_API_KEY || secrets.MYREALTRIP_PARTNER_API_KEY }}
          PARTNER_API_KEY: ${{ secrets.PARTNER_API_KEY }}
          MYREALTRIP_API_BASE_URL: ${{ vars.MYREALTRIP_API_BASE_URL || secrets.MYREALTRIP_API_BASE_URL }}
          MYREALTRIP_PRODUCTS_URL: ${{ vars.MYREALTRIP_PRODUCTS_URL || secrets.MYREALTRIP_PRODUCTS_URL }}
          MYREALTRIP_API_URL: ${{ vars.MYREALTRIP_API_URL || secrets.MYREALTRIP_API_URL }}
          MYREALTRIP_ENDPOINT_URL: ${{ vars.MYREALTRIP_ENDPOINT_URL || secrets.MYREALTRIP_ENDPOINT_URL }}
          PARTNER_API_URL: ${{ vars.PARTNER_API_URL || secrets.PARTNER_API_URL }}
          PARTNER_PRODUCTS_URL: ${{ vars.PARTNER_PRODUCTS_URL || secrets.PARTNER_PRODUCTS_URL }}
          MYREALTRIP_AUTH_MODE: ${{ vars.MYREALTRIP_AUTH_MODE || secrets.MYREALTRIP_AUTH_MODE || 'bearer' }}
          MYREALTRIP_API_KEY_PARAM: ${{ vars.MYREALTRIP_API_KEY_PARAM || secrets.MYREALTRIP_API_KEY_PARAM || 'apiKey' }}
          MYREALTRIP_API_KEY_HEADER: ${{ vars.MYREALTRIP_API_KEY_HEADER || secrets.MYREALTRIP_API_KEY_HEADER }}
          MYREALTRIP_PRODUCT_LIMIT: ${{ vars.MYREALTRIP_PRODUCT_LIMIT || secrets.MYREALTRIP_PRODUCT_LIMIT || '60' }}
          MYREALTRIP_ACCOMMODATION_REGION_URL: ${{ vars.MYREALTRIP_ACCOMMODATION_REGION_URL || secrets.MYREALTRIP_ACCOMMODATION_REGION_URL }}
          MYREALTRIP_ACCOMMODATION_SEARCH_URL: ${{ vars.MYREALTRIP_ACCOMMODATION_SEARCH_URL || secrets.MYREALTRIP_ACCOMMODATION_SEARCH_URL }}
          MYREALTRIP_ACCOMMODATION_KEYWORDS: ${{ vars.MYREALTRIP_ACCOMMODATION_KEYWORDS }}
          MYREALTRIP_ACCOMMODATION_KEYWORD: ${{ vars.MYREALTRIP_ACCOMMODATION_KEYWORD }}
          MYREALTRIP_ACCOMMODATION_IS_DOMESTIC: ${{ vars.MYREALTRIP_ACCOMMODATION_IS_DOMESTIC || 'true' }}
          MYREALTRIP_ACCOMMODATION_NIGHTS: ${{ vars.MYREALTRIP_ACCOMMODATION_NIGHTS || '2' }}
          MYREALTRIP_ACCOMMODATION_ADULT_COUNT: ${{ vars.MYREALTRIP_ACCOMMODATION_ADULT_COUNT || '2' }}
          MYREALTRIP_ACCOMMODATION_CHILD_COUNT: ${{ vars.MYREALTRIP_ACCOMMODATION_CHILD_COUNT || '0' }}
          MYREALTRIP_ACCOMMODATION_STAR_RATING: ${{ vars.MYREALTRIP_ACCOMMODATION_STAR_RATING }}
          MYREALTRIP_ACCOMMODATION_REGION_LIMIT: ${{ vars.MYREALTRIP_ACCOMMODATION_REGION_LIMIT || '8' }}
          MYREALTRIP_ACCOMMODATION_PER_REGION_LIMIT: ${{ vars.MYREALTRIP_ACCOMMODATION_PER_REGION_LIMIT || '3' }}
          MYREALTRIP_ACCOMMODATION_LIMIT: ${{ vars.MYREALTRIP_ACCOMMODATION_LIMIT || '24' }}
          MYREALTRIP_TNA_SEARCH_URL: ${{ vars.MYREALTRIP_TNA_SEARCH_URL || secrets.MYREALTRIP_TNA_SEARCH_URL }}
          MYREALTRIP_TNA_KEYWORDS: ${{ vars.MYREALTRIP_TNA_KEYWORDS }}
          MYREALTRIP_TNA_KEYWORD: ${{ vars.MYREALTRIP_TNA_KEYWORD }}
          MYREALTRIP_TNA_CATEGORY: ${{ vars.MYREALTRIP_TNA_CATEGORY }}
          MYREALTRIP_TNA_MIN_PRICE: ${{ vars.MYREALTRIP_TNA_MIN_PRICE }}
          MYREALTRIP_TNA_MAX_PRICE: ${{ vars.MYREALTRIP_TNA_MAX_PRICE }}
          MYREALTRIP_TNA_SORT: ${{ vars.MYREALTRIP_TNA_SORT || 'price_asc' }}
          MYREALTRIP_TNA_SIZE: ${{ vars.MYREALTRIP_TNA_SIZE || '20' }}
          MYREALTRIP_TNA_QUERY_LIMIT: ${{ vars.MYREALTRIP_TNA_QUERY_LIMIT || '8' }}
          MYREALTRIP_TNA_PER_QUERY_LIMIT: ${{ vars.MYREALTRIP_TNA_PER_QUERY_LIMIT || '3' }}
          MYREALTRIP_TNA_LIMIT: ${{ vars.MYREALTRIP_TNA_LIMIT || '24' }}
          MYREALTRIP_FLIGHT_API_URL: ${{ vars.MYREALTRIP_FLIGHT_API_URL || secrets.MYREALTRIP_FLIGHT_API_URL }}
          MYREALTRIP_FLIGHT_LOWEST_URL: ${{ vars.MYREALTRIP_FLIGHT_LOWEST_URL || secrets.MYREALTRIP_FLIGHT_LOWEST_URL }}
          PARTNER_FLIGHT_API_URL: ${{ vars.PARTNER_FLIGHT_API_URL || secrets.PARTNER_FLIGHT_API_URL }}
          MYREALTRIP_FLIGHT_DEP_AIRPORT: ${{ vars.MYREALTRIP_FLIGHT_DEP_AIRPORT || 'ICN' }}
          MYREALTRIP_FLIGHT_PERIOD: ${{ vars.MYREALTRIP_FLIGHT_PERIOD || '5' }}
          MYREALTRIP_FLIGHT_LIMIT: ${{ vars.MYREALTRIP_FLIGHT_LIMIT || '8' }}
          MYREALTRIP_FLIGHT_URL_TEMPLATE: ${{ vars.MYREALTRIP_FLIGHT_URL_TEMPLATE || secrets.MYREALTRIP_FLIGHT_URL_TEMPLATE }}
        run: |
          node scripts/fetch-myrealtrip-products.mjs
          node scripts/fetch-myrealtrip-accommodations.mjs
          node scripts/fetch-myrealtrip-tna-products.mjs
          node scripts/fetch-myrealtrip-flight-deals.mjs
          node scripts/apply-homepage-content-config.mjs
          node scripts/add-image-zoom.mjs
          node scripts/add-adsense.mjs
          node scripts/add-i18n.mjs
          node scripts/add-map-preview.mjs
          node scripts/build-feed.mjs

      - name: Verify posts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:data/generated-posts.json'], { encoding: 'utf8' }));
          const after = JSON.parse(fs.readFileSync('data/generated-posts.json', 'utf8'));
          const added = after.length - before.length;
          if (added < 10) throw new Error(`Expected 10 new posts, got ${added}`);
          const newPosts = after.slice(0, added);
          const tooManyImages = newPosts.filter((post) => (post.images || []).length > 3);
          if (tooManyImages.length) throw new Error(`Posts over image limit: ${tooManyImages.map((post) => post.slug).join(', ')}`);
          const duplicateSlugs = newPosts.filter((post, index) => newPosts.findIndex((item) => item.slug === post.slug) !== index);
          if (duplicateSlugs.length) throw new Error(`Duplicate new slugs: ${duplicateSlugs.map((post) => post.slug).join(', ')}`);
          const homepage = fs.readFileSync('index.html', 'utf8');
          if (!homepage.includes('class="news-section"') || !homepage.includes('id="booking"')) throw new Error('Homepage topic sections missing from index');
          console.log(`Verified ${added} new posts. Max new post images: ${Math.max(...newPosts.map((post) => (post.images || []).length))}`);
          for (const post of newPosts.slice(0, 10)) console.log(`- ${post.slug}: ${(post.images || []).length} image(s)`);
          NODE

      - name: Commit generated posts
        run: |
          if git diff --quiet; then
            echo "No new posts to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add 10 tour posts"
          git push
