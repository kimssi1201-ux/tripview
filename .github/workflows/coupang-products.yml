name: Coupang Products

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/coupang-products.yml"
      - "scripts/fetch-coupang-products.mjs"
      - "data/coupang-products.json"

permissions:
  contents: write

concurrency:
  group: coupang-products
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Coupang products
        run: node scripts/fetch-coupang-products.mjs
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY || secrets.COUPANG_PARTNERS_ACCESS_KEY || secrets.COUPANG_PARTNER_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY || secrets.COUPANG_PARTNERS_SECRET_KEY || secrets.COUPANG_PARTNER_SECRET_KEY }}
          COUPANG_PARTNER_ID: ${{ secrets.COUPANG_PARTNER_ID || secrets.COUPANG_PARTNERS_ID }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID || secrets.COUPANG_CHANNEL_ID }}

      - name: Commit Coupang products
        run: |
          if git diff --quiet -- data/coupang-products.json site/data/coupang-products.json www/data/coupang-products.json; then
            echo "No Coupang product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coupang-products.json site/data/coupang-products.json www/data/coupang-products.json
          git commit -m "Update Coupang products"
          git pull --rebase origin main
          git push
