name: Enrich Tour Posts
# Touch this file to verify OpenAI enrichment secrets after setup.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/enrich-tour-posts.yml"
      - "scripts/enrich-tour-posts.mjs"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of posts to AI-enrich"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install image processing dependencies
        run: python3 -m pip install --user pillow

      - name: Enrich generated posts
        run: node scripts/enrich-tour-posts.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          OPENAI_ENRICH_LIMIT: ${{ github.event.inputs.limit || '0' }}
          OPENAI_TIMEOUT_MS: ${{ vars.OPENAI_TIMEOUT_MS || '90000' }}

      - name: Process Korea Tourism images
        run: |
          node scripts/process-tour-images.mjs
          node scripts/build-www.mjs

      - name: Commit enriched posts
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet; then
            echo "No enriched posts to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Enrich generated tour posts"
          git push
