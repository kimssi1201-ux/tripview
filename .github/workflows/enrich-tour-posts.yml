name: Enrich Tour Posts

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/enrich-tour-posts.yml"
      - "scripts/enrich-tour-posts.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enrich generated posts
        run: node scripts/enrich-tour-posts.mjs

      - name: Commit enriched posts
        run: |
          if git diff --quiet; then
            echo "No enriched posts to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Enrich generated tour posts"
          git push
